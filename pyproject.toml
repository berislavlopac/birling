[project]
name = "birling"
dynamic = ["version"]
description = "Measure how well Python code is covered by log calls."
readme = "README.md"
authors = [
    { name = "Berislav Lopac", email = "berislav@lopac.net" }
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
]
dependencies = []

[project.scripts]
birling = "birling.cli:main"

[project.optional-dependencies]
coverage = [
    "coverage>=7.16.2",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pyrefly>=1.3.2",
    "ruff>=0.17.0",
    "tox>=4.65.2",
    "tox-uv>=1.36.1",
]
docs = [
    "mkapi>=4.5.0",
    "mkdocs>=1.6.1",
    "mkdocs-materialx>=10.2.0",
    "pymdown-extensions>=12.2",
]
test = [
    "hypothesis>=6.168.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-spec>=6.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Used when building outside a tagged checkout (sdist without .git, or a shallow
# clone). Tagged builds derive the version from the tag.
fallback_version = "0.0.0"

[tool.uv]
default-groups = ["dev", "test"]

[tool.tox]
env_list = ["py311", "py312", "py313", "py314", "py315"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
extras = ["coverage"]
commands = [["pytest", "--cov"]]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["birling/"]

[tool.coverage.report]
skip_covered = false
show_missing = true
fail_under = 90
exclude_also = ["pragma: no cover", "@abstract"]

[tool.pyrefly]
project-includes = ["birling"]

[tool.ruff]
line-length = 96
output-format = "grouped"

[tool.ruff.lint]
select = [  # see https://docs.astral.sh/ruff/rules/
    "E4", "E7", "E9",  # basic pycodestyle rules
    "F",        # Pyflakes rules
    "W",        # pycodestyle warnings
    "C90",      # McCabe complexity
    "N",        # PEP8 naming conventions
    "I",        # import statements linting and formatting
    "D",        # docstrings, with pydocstyle
    "ANN",      # missing type annotations
    "PLR",      # Pylint refactoring recommendations
    "PTH",      # recommends to use pathlib instead of os.path
    "UP",       # pyupgrade suggestions
    "BLE",      # locates blind exception capture
    "B",        # locates possible bugs and design problems
    "A",        # locates shadowing of builtin names
    "C4",       # locates possible issues with comprehensions
    "DTZ",      # locates incorrect use of timezone information
    "PIE",      # miscellaneous linting rules
    "TRY",      # locates potential exception handling antipatterns
    "PERF",     # locates potential performance issues
    "RUF",      # various Ruff-specific linting rules
    "S",        # various insecure code, with bandit
    "ERA",      # eradicate: commented-out code
]
ignore = [
    "D105",     # magic methods document themselves
    "D107",     # `__init__` is documented on its class
]
external = [
    "F841",     # vulture uses this code for ignoring unused names
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "D",        # test names are the specification; docstrings are optional
    "ANN",      # tests are not type-checked
    "PLR0913",  # unlimited function arguments
    "S101",     # allow asserts
    "N802",     # allow variable case in test names
    "PLR2004",  # allow magic values in comparisons
]

[tool.ruff.lint.isort]
known-first-party = ["birling"]
combine-as-imports = true

[tool.ruff.format]
docstring-code-format = false
